 great_project_type_grand_canals: "大运河"
 great_project_type_grand_canals_desc: "大运河始筑于春秋，于隋炀帝大业年间全面贯通，以东都洛阳为中枢，北通涿郡幽州（永济渠），南达余杭杭州（通济渠、山阳渎与江南河）。作为贯通南北水脉的天下之命脉，如今运用新技术疏浚扩建这一庞大的水运体系，将使汴洛与江淮漕运畅通无阻，重现舟楫相望的繁华盛景。"